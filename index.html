<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ливерпуль</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ливерпуль">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">

<style>
:root{
  --bg:#f2f2f7; --card:#fff; --text:#111; --muted:#6e6e73; --line:rgba(60,60,67,.18);
  --accent:#c8102e; --accent-soft:rgba(200,16,46,.10); --live:#ff3b30; --gold:#c9961a;
  --bar:rgba(249,249,251,.82);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000; --card:#1c1c1e; --text:#f5f5f7; --muted:#98989f; --line:rgba(84,84,88,.55);
    --accent:#ff6b7d; --accent-soft:rgba(255,107,125,.16); --gold:#f2c14e; --bar:rgba(22,22,24,.82);}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{overscroll-behavior:none}
#app{height:100%;display:flex;flex-direction:column}
.screen{display:none;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 24px;
  padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.screen.active{display:block}
h1{font-size:34px;font-weight:800;letter-spacing:-.6px;margin:8px 0 14px}
h2{font-size:13px;font-weight:600;color:var(--muted);margin:26px 0 8px 16px;letter-spacing:.2px}

/* Hero match card */
.hero{background:var(--card);border-radius:26px;padding:20px 16px 18px;text-align:center}
.meta{display:flex;justify-content:center;align-items:center;gap:8px;color:var(--muted);font-size:14px;min-height:26px}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;padding:4px 10px;border-radius:99px;
  background:var(--accent-soft);color:var(--accent)}
.pill.live{background:var(--live);color:#fff}
.pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:20px 0 6px}
.team{display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:600;font-size:16px}
.crest{position:relative;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:22px;color:#fff}
.crest img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.crest.has{background:transparent!important;font-size:0}
.center{min-width:112px}
.score{font-size:52px;font-weight:800;letter-spacing:-2px;font-variant-numeric:tabular-nums;line-height:1}
.score.bump{animation:bump .6s}
@keyframes bump{30%{transform:scale(1.18);color:var(--gold)}}
.clock{font-size:20px;font-weight:700;color:var(--live);margin-top:8px;font-variant-numeric:tabular-nums}
.kick{font-size:28px;font-weight:800;letter-spacing:-.5px}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.count{margin-top:14px;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.btn{width:100%;margin-top:18px;border:0;border-radius:14px;padding:15px;font:600 17px -apple-system,sans-serif;
  background:var(--accent);color:#fff;cursor:pointer}
.btn:active{opacity:.7}
body.dark-btn .btn{color:#000}
@media (prefers-color-scheme:dark){.btn{color:#000}}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}

/* Grouped lists */
.list{background:var(--card);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;padding:12px 16px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--line)}
.date{font-size:13px;color:var(--muted);line-height:1.2;text-align:center}
.date b{display:block;font-size:20px;color:var(--text)}
.mini{width:22px;height:22px;object-fit:contain;flex:none}
.mini.ph{border-radius:50%;background:var(--line)}
.tm{display:flex;align-items:center;gap:9px;font-weight:600;line-height:1.25}
.tm+.tm{margin-top:5px}
.tm span{min-width:0}
.opp small{margin-top:5px}
.opp{font-weight:600}.opp small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.res{font-weight:800;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.badge{width:22px;height:22px;border-radius:6px;font-size:12px;display:grid;place-items:center;color:#fff}
.W{background:#34c759}.D{background:#8e8e93}.L{background:#ff3b30}
.time{font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}

/* events */
.ev{display:grid;grid-template-columns:44px 1fr;gap:6px;padding:11px 16px;position:relative;align-items:center}
.ev+.ev::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--line)}
.ev .m{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{padding:18px 16px;color:var(--muted);text-align:center}

/* Match details */
.hero[data-id],.row[data-id]{cursor:pointer}
.row[data-id]:active{background:var(--accent-soft)}
#app.detail .tabbar{display:none}
.back{background:none;border:0;color:var(--accent);font:600 17px -apple-system,sans-serif;padding:6px 0;margin:2px 0 8px;cursor:pointer}
.seg{display:flex;background:var(--accent-soft);border-radius:10px;padding:2px;margin:16px 0 12px}
.seg button{flex:1;border:0;background:none;padding:8px 0;border-radius:8px;font:600 14px -apple-system,sans-serif;color:var(--text);cursor:pointer}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.st{padding:11px 16px;position:relative}
.st+.st::before,.pl+.pl::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--line)}
.st .h{display:grid;grid-template-columns:1fr auto 1fr;font-weight:700;font-variant-numeric:tabular-nums;align-items:center}
.st .h span:nth-child(2){color:var(--muted);font-weight:500;font-size:14px;text-align:center;padding:0 8px}
.st .h span:last-child{text-align:right}
.bar{display:flex;gap:4px;height:5px;margin-top:7px}
.bar i{display:block;border-radius:3px;background:var(--line);min-width:3px}
.bar i.me{background:var(--accent)}
.th{display:flex;align-items:center;gap:9px;padding:13px 16px 6px;font-weight:700}
.th small{margin-left:auto;color:var(--muted);font-weight:500}
.sub-h{padding:8px 16px 2px;color:var(--muted);font-size:12.5px;font-weight:600}
.pl{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:9px 16px;align-items:center;position:relative}
.pl .n{color:var(--muted);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.pl .p{color:var(--muted);font-size:13px}
.note{padding:20px 16px;color:var(--muted);text-align:center;font-size:15px}
/* Tab bar */
.tabbar{display:flex;background:var(--bar);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
  border-top:.5px solid var(--line);padding:6px 0 calc(env(safe-area-inset-bottom,0px) + 2px)}
.tab{flex:1;border:0;background:none;color:var(--muted);font:500 11px -apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;cursor:pointer}
.tab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.active{color:var(--accent)}

p.foot{color:var(--muted);font-size:12.5px;margin:12px 16px 0}
/* In-app push banner */
#toast{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:20;
  background:var(--bar);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border:.5px solid var(--line);border-radius:22px;padding:12px 16px;box-shadow:0 10px 30px rgba(0,0,0,.18);
  display:flex;gap:12px;align-items:center;transform:translateY(-160%);transition:transform .4s cubic-bezier(.2,.9,.3,1)}
#toast.show{transform:none}
#toast .ic{font-size:26px}
#toast b{display:block;font-size:15px}#toast span{font-size:14px;color:var(--muted)}

/* Install hint */
#install{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);z-index:15;display:none;
  background:var(--card);border-radius:20px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.28);border:.5px solid var(--line)}
#install.show{display:block}
#install b{font-size:16px}
#install p{margin:6px 0 12px;color:var(--muted);font-size:14.5px}
#install .btn{margin:0;padding:11px}
#install svg{width:18px;height:18px;vertical-align:-3px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#install::after{content:"";position:absolute;bottom:-8px;left:50%;margin-left:-9px;width:18px;height:18px;background:var(--card);transform:rotate(45deg);border-right:.5px solid var(--line);border-bottom:.5px solid var(--line)}
</style>
</head>
<body>
<div id="app">
  <div id="toast"><div class="ic" id="toastIc"></div><div><b id="toastT"></b><span id="toastS"></span></div></div>

  <section class="screen active" id="home">
    <h1>Матч</h1>
    <div class="hero" id="hero"></div>
    <p class="foot" id="src" style="text-align:center"></p>
    <h2>Прошлые матчи</h2>
    <div class="list" id="pastHome"></div>
    <h2>Следующие матчи</h2>
    <div class="list" id="next"></div>
  </section>

  <section class="screen" id="detail">
    <button class="back" id="back">‹ Назад</button>
    <div class="hero" id="dHero"></div>
    <div class="seg" id="seg"><button data-tab="stats">Статистика</button><button data-tab="lineups">Составы</button><button data-tab="events">События</button></div>
    <div id="dBody"></div>
  </section>

  <section class="screen" id="cal">
    <h1>Календарь</h1>
    <h2>Ближайшие игры</h2>
    <div class="list" id="upcoming"></div>
    <h2>Результаты</h2>
    <div class="list" id="past"></div>
    <p class="foot" id="foot"></p>
  </section>

  <nav class="tabbar">
    <button class="tab active" data-t="home"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8l3.5 2.5-1.3 4h-4.4l-1.3-4zM12 3v5M20 10l-4.5.5M17.5 18l-3.3-3.5M6.5 18l3.3-3.5M4 10l4.5.5"/></svg>Матч</button>
    <button class="tab" data-t="cal"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Календарь</button>
  </nav>

  <div id="install">
    <b>Как установить</b>
    <p>Нажмите <svg viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg> «Поделиться» → «На экран Домой»</p>
    <button class="btn ghost" id="installOk">Понятно</button>
  </div>
</div>

<script>
window.addEventListener('error',function(e){var d=document.createElement('div');
d.style.cssText='position:fixed;z-index:99;left:8px;right:8px;top:60px;background:#fff3cd;color:#000;padding:10px;border-radius:10px;font:13px monospace';
d.textContent='Ошибка: '+e.message+' ('+(e.lineno||'?')+')';document.body.appendChild(d)});
</script>

/* ---------- Загрузка live-данных ESPN ---------- */
const ymd = d => d.toISOString().slice(0,10).replace(/-/g,'');
async function loadMatches(){
  const a=new Date(Date.now()-21*864e5), b=new Date(Date.now()+90*864e5), keys=Object.keys(LEAGUES);
  ERRS=[];
  const get=url=>fetch(url,{cache:'no-store'}).then(r=>{if(!r.ok){ERRS.push('HTTP '+r.status);return null}return r.json()}).catch(()=>{ERRS.push('сеть/CORS');return null});
  const ranged=await Promise.all(keys.map(lg=>get(`${ESPN}${lg}/scoreboard?dates=${ymd(a)}-${ymd(b)}&limit=300`)));
  const today =await Promise.all(keys.map(lg=>get(`${ESPN}${lg}/scoreboard`)));   // свежие live-данные
  if(ranged.every(r=>!r)&&today.every(r=>!r)) throw new Error(ERRS[0]||'offline');
  const map=new Map();
  [ranged,today].forEach(arr=>arr.forEach((j,i)=>{
    if(!j||!j.events) return;
    (j.events||[]).forEach(ev=>{
      const c=ev.competitions&&ev.competitions[0]; if(!c||!c.competitors) return;
      const me=c.competitors.find(x=>x.team&&String(x.team.id)===TEAM_ID); if(!me) return;
      const op=c.competitors.find(x=>x!==me), home=c.competitors.find(x=>x.homeAway==='home'), away=c.competitors.find(x=>x.homeAway==='away');
      const st=ev.status||c.status||{}, ty=st.type||{};
      const f={id:ev.id, opp:ru(op.team.displayName||op.team.name), oppLogo:op.team.logo, home:me===home, comp:LEAGUES[keys[i]], lg:keys[i],
        venue:(c.venue&&c.venue.fullName)||'', date:new Date(ev.date), state:ty.state||'pre', clock:st.displayClock||'',
        ht:ty.name==='STATUS_HALFTIME', events:[]};
      if(f.state!=='pre'){ f.hs=parseInt(home.score,10)||0; f.as=parseInt(away.score,10)||0; }
      if(home.shootoutScore!=null&&away.shootoutScore!=null) f.pens=[+home.shootoutScore,+away.shootoutScore];
      f.events=(c.details||[]).map(d=>({
        min:(d.clock&&d.clock.displayValue)||'', goal:!!d.scoringPlay, yellow:!!d.yellowCard, red:!!d.redCard,
        og:!!d.ownGoal, pen:!!d.penaltyKick, mine:!!(d.team&&String(d.team.id)===TEAM_ID),
        player:(d.athletesInvolved&&d.athletesInvolved[0]&&d.athletesInvolved[0].displayName)||''
      })).filter(e=>e.goal||e.yellow||e.red);
      map.set(f.id,f);
    });
  }));
  const out=[...map.values()];
  if(!out.length) throw new Error('нет матчей Ливерпуля в ответе');
  out.sort((x,y)=>x.date-y.date);
  return out;
}

// если ESPN вернул меньше матчей, дополняем будущие игры встроенным расписанием
function mergeStatic(fx){
  const key=f=>f.opp+ymd(f.date), have=new Set(fx.map(key));
  return fx.concat(STATIC.filter(f=>f.state==='pre'&&f.date>Date.now()&&!have.has(key(f)))).sort((a,b)=>a.date-b.date);
}
let firstLoad=true, ERRS=[], LASTOK=null, LASTERR='';
async function refresh(){
  try{
    const prev=Object.fromEntries(FIXTURES.map(f=>[f.id,(f.events||[]).filter(e=>e.goal).length]));
    const fx=await loadMatches();
    FIXTURES=mergeStatic(fx); SOURCE='live'; LASTOK=new Date(); LASTERR=''; store.set('fx',JSON.stringify(FIXTURES));
    if(!firstLoad) fx.filter(f=>f.state==='in').forEach(f=>{
      const goals=f.events.filter(e=>e.goal);
      if(goals.length>(prev[f.id]||0)){const g=goals[goals.length-1], [L,R]=names(f);
        toast('⚽️','ГОЛ! '+(g.mine?TEAM.name:f.opp),`${g.player||''} ${g.min} · ${L} ${f.hs}:${f.as} ${R}`)}
    });
  }catch(e){ if(SOURCE==='live') SOURCE='cache'; LASTERR=(e&&e.message)||'ошибка'; }
  firstLoad=false;
  renderAll();
  if(DET.open){renderDetail();loadDetail()}
}
function nearMatch(){const n=Date.now();return FIXTURES.some(f=>f.state==='in'||(f.state==='pre'&&n>f.date-15*60000&&n<f.date.getTime()+130*60000))}
(function loop(){ setTimeout(async()=>{await refresh();loop()}, nearMatch()?15000:180000) })();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});

const $ = s=>document.querySelector(s);
const fmtDay = d=>d.toLocaleDateString('ru-RU',{day:'numeric'});
const fmtMon = d=>d.toLocaleDateString('ru-RU',{month:'short'}).replace('.','');
const fmtTime= d=>d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
const fmtLong= d=>d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
const colorOf=n=>(n===TEAM.name?TEAM.color:'#5b6475');
const crest = (n,logo)=>{
  const src=CREST_DATA[n]||logo||'';
  const img=src?`<img src="${src}" alt="" onload="this.parentNode.classList.add('has')" onerror="this.remove()">`:'';
  return `<div class="crest" style="background:${colorOf(n)}">${n===TEAM.name?TEAM.short:n.replace(/[^A-Za-zА-Яа-я]/g,'').slice(0,3).toUpperCase()}${img}</div>`};
const miniCrest=(n,logo)=>{const s=CREST_DATA[n]||logo;
  return s?`<img class="mini" src="${s}" alt="" onerror="this.outerHTML='<span class=&quot;mini ph&quot;></span>'">`:'<span class="mini ph"></span>'};
const names=f=>f.home?[TEAM.name,f.opp]:[f.opp,TEAM.name];
const logos=f=>f.home?[null,f.oppLogo]:[f.oppLogo,null];
const isPlayed=f=>f.state==='post';
function outcome(f){
  const my=f.home?f.hs:f.as, th=f.home?f.as:f.hs;
  if(my!==th) return my>th?'W':'L';
  if(f.pens){const mp=f.home?f.pens[0]:f.pens[1],tp=f.home?f.pens[1]:f.pens[0];return mp>tp?'W':'L'}
  return 'D';
}
const penText=f=>f.pens?`по пенальти ${f.pens[0]}:${f.pens[1]}`:'';
const upcomingOK=f=>f.state==='in'||(f.state==='pre'&&Date.now()<f.date.getTime()+130*60000);

/* ---------- Рендер ---------- */
let lastKey='', HERO_ID=null;
function statusBlock(f){
  const now=Date.now(), live=f.state==='in', done=f.state==='post';
  if(live) return {top:`<span class="pill ${f.ht?'':'live'}">${f.ht?'Перерыв':'LIVE'}</span><span>${f.comp}</span>`,
    mid:`<div class="score">${f.hs}:${f.as}</div>${f.ht?'<div class="clock" style="color:var(--muted)">HT</div>':`<div class="clock">${f.clock||''}</div>`}`};
  if(done){const o=outcome(f), v={W:'Победа',D:'Ничья',L:'Поражение'}[o]+(f.pens?' '+penText(f):'');
    return {top:`<span class="pill">Завершён</span><span>${f.comp}</span>`, mid:`<div class="score">${f.hs}:${f.as}</div><div class="sub">${v}</div>`}}
  if(f.date<=now){const going=now<f.date.getTime()+130*60000;
    return {top:`<span class="pill ${going?'live':''}">${going?'Идёт':'Завершён'}</span><span>${f.comp}</span>`,
      mid:`<div class="score">—:—</div><div class="sub">${going?(SOURCE==='live'?'Ждём данные о счёте':'Нет live-данных'):'Результат уточняется'}</div>`}}
  return {top:`<span class="pill">Скоро</span><span>${f.comp}</span>`, mid:`<div class="kick">${fmtTime(f.date)}</div>`};
}
function heroMarkup(f){
  const [L,R]=names(f), [lg,rg]=logos(f), sb=statusBlock(f);
  return `<div class="meta">${sb.top}</div>
    <div class="teams"><div class="team">${crest(L,lg)}${L}</div><div class="center">${sb.mid}</div><div class="team">${crest(R,rg)}${R}</div></div>
    <div class="sub">${fmtLong(f.date)}, ${fmtTime(f.date)}</div><div class="sub">${f.venue}</div>`;
}
function renderHero(){
  const hero=$('#hero'), now=Date.now();
  // самое недавнее событие: идущий матч, иначе последний начавшийся (даже если итог ещё не получен)
  const f=FIXTURES.find(x=>x.state==='in')||[...FIXTURES].filter(x=>x.date<=now).sort((a,b)=>b.date-a.date)[0];
  if(!f){HERO_ID=null;hero.removeAttribute('data-id');hero.innerHTML='<div class="empty">Нет данных о матчах</div>';return}
  HERO_ID=f.id; hero.dataset.id=f.id;
  const key=[f.id,f.state,f.hs,f.as,f.clock,f.ht,SOURCE,Math.floor(now/600000)].join('|');
  if(key!==lastKey){
    const prevScore=lastKey.split('|').slice(2,4).join('|');
    lastKey=key; hero.innerHTML=heroMarkup(f);
    if(f.state==='in'&&f.hs!==undefined&&prevScore!==[f.hs,f.as].join('|')) bumpScore();
  }
}
function bumpScore(){const s=$('.score');if(s){s.classList.remove('bump');void s.offsetWidth;s.classList.add('bump')}}

function rowHTML(f,right){
  const [L,R]=names(f), [lg,rg]=logos(f);
  return `<div class="row" data-id="${f.id}"><div class="date"><b>${fmtDay(f.date)}</b>${fmtMon(f.date)}</div>
    <div class="opp"><div class="tm">${miniCrest(L,lg)}<span>${L}</span></div><div class="tm">${miniCrest(R,rg)}<span>${R}</span></div><small>${f.comp}</small></div>${right}</div>`;
}
const upRight=f=>f.state==='in'?`<div class="res">${f.hs}:${f.as}<span class="pill live">Live</span></div>`:
  (Date.now()>=f.date?'<span class="pill live">Идёт</span>':`<div class="time">${fmtTime(f.date)}</div>`);
const pastRight=f=>{const o=outcome(f);return `<div class="res">${f.hs}:${f.as}<span class="badge ${o}">${{W:'В',D:'Н',L:'П'}[o]}</span></div>`};
function renderLists(){
  const past=FIXTURES.filter(f=>isPlayed(f)&&f.id!==HERO_ID).sort((a,b)=>b.date-a.date).slice(0,3);
  $('#pastHome').innerHTML=past.map(f=>rowHTML(f,pastRight(f))).join('')||'<div class="empty">Нет прошедших матчей</div>';
  const next=FIXTURES.filter(f=>f.state==='pre'&&upcomingOK(f)&&f.id!==HERO_ID).sort((a,b)=>a.date-b.date).slice(0,3);
  $('#next').innerHTML=next.map(f=>rowHTML(f,upRight(f))).join('')||'<div class="empty">Нет ближайших матчей</div>';
}
function renderCalendar(){
  const up=FIXTURES.filter(upcomingOK).sort((a,b)=>a.date-b.date);
  const past=FIXTURES.filter(isPlayed).sort((a,b)=>b.date-a.date);
  $('#upcoming').innerHTML=up.map(f=>rowHTML(f,upRight(f))).join('')||'<div class="empty">Нет ближайших матчей</div>';
  $('#past').innerHTML=past.map(f=>{const o=outcome(f);
    return rowHTML(f,`<div class="res">${f.hs}:${f.as}<span class="badge ${o}">${{W:'В',D:'Н',L:'П'}[o]}</span></div>`)}).join('')||'<div class="empty">Нет результатов</div>';
  $('#foot').textContent={live:'Данные: ESPN, обновляются автоматически.',cache:'Нет связи с ESPN — показаны последние сохранённые данные.',
    static:'Нет связи с ESPN — показаны встроенные данные на 1 ноября 2026.'}[SOURCE];
}
function renderSrc(){
  const n=nearMatch();
  $('#src').textContent = SOURCE==='live' ? `ESPN · обновлено ${fmtTime(LASTOK)}${n?' · автообновление 15 с':''}`
    : `ESPN недоступен${LASTERR?' ('+LASTERR+')':''} — показаны ${SOURCE==='cache'?'сохранённые':'встроенные'} данные`;
}
function renderAll(){renderHero();renderLists();renderCalendar();renderSrc()}

/* ---------- Баннер-уведомление ---------- */
let toastTimer;
function toast(ic,t,s){
  $('#toastIc').textContent=ic;$('#toastT').textContent=t;$('#toastS').textContent=s;
  $('#toast').classList.add('show'); if(navigator.vibrate) navigator.vibrate(80);
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),5000);
}
$('#toast').onclick=()=>$('#toast').classList.remove('show');


/* ---------- Подробности матча ---------- */
const DET={open:false,id:null,tab:'stats',data:{},err:{},prev:'home'};
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STAT_ORDER=[['possessionPct','Владение мячом','%'],['totalShots','Удары'],['shotsOnTarget','Удары в створ'],['blockedShots','Заблокированные удары'],
  ['wonCorners','Угловые'],['offsides','Офсайды'],['foulsCommitted','Фолы'],['yellowCards','Жёлтые карточки'],['redCards','Красные карточки'],
  ['saves','Сэйвы'],['accuratePasses','Точные передачи'],['passPct','Точность передач','%'],['effectiveTackles','Отборы'],['interceptions','Перехваты']];

function openMatch(id){
  DET.open=true; DET.id=id; DET.tab='stats';
  DET.prev=(document.querySelector('.screen.active')||{}).id||'home'; if(DET.prev==='detail')DET.prev='home';
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id==='detail'));
  $('#app').classList.add('detail'); $('#detail').scrollTop=0;
  renderDetail(); loadDetail();
}
function closeMatch(){DET.open=false;$('#app').classList.remove('detail');switchTab(DET.prev)}
async function loadDetail(){
  const id=DET.id, f=FIXTURES.find(x=>x.id===id); if(!f) return;
  if(!f.lg){DET.err[id]='нет данных ESPN для этого матча';renderDetail();return}
  try{
    const r=await fetch(`${ESPN}${f.lg}/summary?event=${encodeURIComponent(id)}`,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    DET.data[id]=await r.json(); DET.err[id]='';
  }catch(e){ DET.err[id]=(e&&e.message)||'сеть/CORS' }
  if(DET.open&&DET.id===id) renderDetail();
}
function parseSummary(j,f){
  const pick=arr=>{const me=arr.find(x=>x&&x.team&&String(x.team.id)===TEAM_ID), op=arr.find(x=>x&&x!==me);
    return f.home?[me,op]:[op,me]};
  const out={stats:[],lineups:null};
  const bt=(j.boxscore&&j.boxscore.teams)||[];
  if(bt.length>=2){
    const [l,r]=pick(bt), m=t=>{const o={};((t&&t.statistics)||[]).forEach(x=>{o[x.name]=x.displayValue!=null?x.displayValue:x.value});return o};
    const ls=m(l), rs=m(r);
    STAT_ORDER.forEach(([k,label,unit])=>{
      if(ls[k]==null&&rs[k]==null) return;
      const lv=parseFloat(ls[k])||0, rv=parseFloat(rs[k])||0, tot=lv+rv;
      out.stats.push({label,l:(ls[k]==null?'—':ls[k])+(unit&&ls[k]!=null?unit:''),r:(rs[k]==null?'—':rs[k])+(unit&&rs[k]!=null?unit:''),pct:tot>0?lv/tot*100:50});
    });
  }
  const ro=j.rosters||[];
  if(ro.length>=2){
    const mk=t=>{ if(!t||!t.roster||!t.roster.length) return null;
      const pl=t.roster.map(p=>({n:p.jersey||'',name:(p.athlete&&(p.athlete.displayName||p.athlete.fullName))||'—',
        pos:(p.position&&(p.position.abbreviation||p.position.name))||'',starter:!!p.starter}));
      return {name:t.team&&ru(t.team.displayName||t.team.name), formation:typeof t.formation==='object'&&t.formation?t.formation.name:(t.formation||''),
        starters:pl.filter(p=>p.starter), subs:pl.filter(p=>!p.starter)} };
    const [l,r]=pick(ro); out.lineups=[mk(l),mk(r)];
  }
  return out;
}
function lineupHTML(t,side,f){
  if(!t) return '';
  const nm=side===(f.home?0:1)?TEAM.name:f.opp, lg=side===0?logos(f)[0]:logos(f)[1];
  const row=p=>`<div class="pl"><div class="n">${esc(p.n)}</div><div>${esc(p.name)}</div><div class="p">${esc(p.pos)}</div></div>`;
  return `<div class="th">${miniCrest(nm,lg)}<span>${esc(nm)}</span>${t.formation?`<small>${esc(t.formation)}</small>`:''}</div>
    <div class="list">${t.starters.map(row).join('')||'<div class="note">Состав не объявлен</div>'}</div>
    ${t.subs.length?`<div class="sub-h">Запасные</div><div class="list">${t.subs.map(row).join('')}</div>`:''}`;
}
function renderDetail(){
  if(!DET.open) return;
  const f=FIXTURES.find(x=>x.id===DET.id); if(!f){closeMatch();return}
  $('#dHero').innerHTML=heroMarkup(f);
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.tab===DET.tab));
  const body=$('#dBody'), raw=DET.data[DET.id], err=DET.err[DET.id];
  if(DET.tab==='events'){
    const ev=f.events||[];
    body.innerHTML=ev.length?'<div class="list">'+(f.state==='in'?[...ev].reverse():ev).map(e=>`<div class="ev"><div class="m">${esc(e.min)}</div>
      <div>${e.goal?'⚽️':e.red?'🟥':'🟨'} <b>${esc(e.player||'—')}</b>${e.goal?(e.og?' (автогол)':e.pen?' (пен.)':''):''} <span style="color:var(--muted)">· ${esc(e.mine?TEAM.name:f.opp)}</span></div></div>`).join('')+'</div>'
      :`<div class="note">${f.state==='pre'?'Матч ещё не начался':'Нет данных о событиях'}</div>`;
    return;
  }
  if(!raw){ body.innerHTML=`<div class="note">${err?'Подробные данные недоступны ('+esc(err)+').':'Загрузка…'}</div>`; return }
  const d=parseSummary(raw,f);
  if(DET.tab==='stats'){
    if(!d.stats.length){body.innerHTML=`<div class="note">${f.state==='pre'?'Статистика появится после начала матча':'Статистика недоступна'}</div>`;return}
    const [L,R]=names(f), meLeft=f.home;
    body.innerHTML='<div class="list">'+d.stats.map(s=>`<div class="st"><div class="h"><span>${esc(s.l)}</span><span>${esc(s.label)}</span><span>${esc(s.r)}</span></div>
      <div class="bar"><i class="${meLeft?'me':''}" style="flex:${s.pct}"></i><i class="${meLeft?'':'me'}" style="flex:${100-s.pct}"></i></div></div>`).join('')+'</div>';
  } else {
    const lu=d.lineups;
    body.innerHTML=lu&&(lu[0]||lu[1])?lineupHTML(lu[0],0,f)+lineupHTML(lu[1],1,f):`<div class="note">${f.state==='pre'?'Составы пока не объявлены':'Составы недоступны'}</div>`;
  }
}
document.addEventListener('click',e=>{
  if(e.target.closest('#back')){closeMatch();return}
  const sg=e.target.closest('#seg button'); if(sg){DET.tab=sg.dataset.tab;renderDetail();return}
  if(DET.open) return;
  const t=e.target.closest('[data-id]'); if(t) openMatch(t.dataset.id);
});

/* ---------- Навигация ---------- */
function switchTab(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.t===id));
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchTab(t.dataset.t));

renderAll();   // сразу показываем сохранённые данные
refresh();     // затем подтягиваем свежие

/* ---------- Подсказка установки (iOS Safari) ---------- */
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone=window.navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
if(isIOS&&!standalone&&!store.get('installHintDismissed')){
  setTimeout(()=>$('#install').classList.add('show'),1500);
}
$('#installOk').onclick=()=>{$('#install').classList.remove('show');store.set('installHintDismissed','1')};

/* ---------- Service Worker ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(console.warn));
}

</script>
</body>
</html>
