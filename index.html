<style>
:root{
  --bg:#f2f2f7; --card:#fff; --text:#111; --muted:#6e6e73; --line:rgba(60,60,67,.18);
  --accent:#c8102e; --accent-soft:rgba(200,16,46,.10); --live:#ff3b30; --gold:#c9961a;
  --bar:rgba(249,249,251,.82);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000; --card:#1c1c1e; --text:#f5f5f7; --muted:#98989f; --line:rgba(84,84,88,.55);
    --accent:#ff6b7d; --accent-soft:rgba(255,107,125,.16); --gold:#f2c14e; --bar:rgba(22,22,24,.82);}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{overscroll-behavior:none}
#app{height:100%;display:flex;flex-direction:column}
.screen{display:none;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 24px;
  padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.screen.active{display:block}
h1{font-size:34px;font-weight:800;letter-spacing:-.6px;margin:8px 0 14px}
h2{font-size:13px;font-weight:600;color:var(--muted);margin:26px 0 8px 16px;letter-spacing:.2px}

/* Hero match card */
.hero{background:var(--card);border-radius:26px;padding:20px 16px 18px;text-align:center}
.meta{display:flex;justify-content:center;align-items:center;gap:8px;color:var(--muted);font-size:14px;min-height:26px}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;padding:4px 10px;border-radius:99px;
  background:var(--accent-soft);color:var(--accent)}
.pill.live{background:var(--live);color:#fff}
.pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:20px 0 6px}
.team{display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:600;font-size:16px}
.crest{position:relative;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:22px;color:#fff}
.crest img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.crest.has{background:transparent!important;font-size:0}
.center{min-width:112px}
.score{font-size:52px;font-weight:800;letter-spacing:-2px;font-variant-numeric:tabular-nums;line-height:1}
.score.bump{animation:bump .6s}
@keyframes bump{30%{transform:scale(1.18);color:var(--gold)}}
.clock{font-size:20px;font-weight:700;color:var(--live);margin-top:8px;font-variant-numeric:tabular-nums}
.kick{font-size:28px;font-weight:800;letter-spacing:-.5px}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.count{margin-top:14px;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.btn{width:100%;margin-top:18px;border:0;border-radius:14px;padding:15px;font:600 17px -apple-system,sans-serif;
  background:var(--accent);color:#fff;cursor:pointer}
.btn:active{opacity:.7}
body.dark-btn .btn{color:#000}
@media (prefers-color-scheme:dark){.btn{color:#000}}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}

/* Grouped lists */
.list{background:var(--card);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;padding:12px 16px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--line)}
.date{font-size:13px;color:var(--muted);line-height:1.2;text-align:center}
.date b{display:block;font-size:20px;color:var(--text)}
.mini{width:22px;height:22px;object-fit:contain;flex:none}
.mini.ph{border-radius:50%;background:var(--line)}
.tm{display:flex;align-items:center;gap:9px;font-weight:600;line-height:1.25}
.tm+.tm{margin-top:5px}
.tm span{min-width:0}
.opp small{margin-top:5px}
.opp{font-weight:600}.opp small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.res{font-weight:800;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.badge{width:22px;height:22px;border-radius:6px;font-size:12px;display:grid;place-items:center;color:#fff}
.W{background:#34c759}.D{background:#8e8e93}.L{background:#ff3b30}
.time{font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}

/* events */
.ev{display:grid;grid-template-columns:44px 1fr;gap:6px;padding:11px 16px;position:relative;align-items:center}
.ev+.ev::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--line)}
.ev .m{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{padding:18px 16px;color:var(--muted);text-align:center}

/* Match details */
.hero[data-id],.row[data-id]{cursor:pointer}
.row[data-id]:active{background:var(--accent-soft)}
#app.detail .tabbar{display:none}
.back{background:none;border:0;color:var(--accent);font:600 17px -apple-system,sans-serif;padding:6px 0;margin:2px 0 8px;cursor:pointer}
.seg{display:flex;background:var(--accent-soft);border-radius:10px;padding:2px;margin:16px 0 12px}
.seg button{flex:1;border:0;background:none;padding:8px 0;border-radius:8px;font:600 14px -apple-system,sans-serif;color:var(--text);cursor:pointer}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.st{padding:11px 16px;position:relative}
.st+.st::before,.pl+.pl::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--line)}
.st .h{display:grid;grid-template-columns:1fr auto 1fr;font-weight:700;font-variant-numeric:tabular-nums;align-items:center}
.st .h span:nth-child(2){color:var(--muted);font-weight:500;font-size:14px;text-align:center;padding:0 8px}
.st .h span:last-child{text-align:right}
.bar{display:flex;gap:4px;height:5px;margin-top:7px}
.bar i{display:block;border-radius:3px;background:var(--line);min-width:3px}
.bar i.me{background:var(--accent)}
.th{display:flex;align-items:center;gap:9px;padding:13px 16px 6px;font-weight:700}
.th small{margin-left:auto;color:var(--muted);font-weight:500}
.sub-h{padding:8px 16px 2px;color:var(--muted);font-size:12.5px;font-weight:600}
.pl{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:9px 16px;align-items:center;position:relative}
.pl .n{color:var(--muted);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.pl .p{color:var(--muted);font-size:13px}
.note{padding:20px 16px;color:var(--muted);text-align:center;font-size:15px}
/* Player stats */
.ps{display:grid;grid-template-columns:28px 1fr auto;gap:4px 10px;align-items:center;padding:11px 16px;position:relative}
.ps+.ps::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--line)}
.ps .rk{color:var(--muted);font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.ps .nm b{display:block;font-weight:600}.ps .nm small{color:var(--muted);font-size:13px}
.ps .val{font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;text-align:right}
.ps .val.na{color:var(--muted);font-weight:500;font-size:15px}
.psbar{grid-column:2 / 4;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.psbar i{display:block;height:100%;border-radius:2px;background:var(--accent)}
.ps.top .rk{color:var(--accent)}
.res-W{color:#34c759;font-weight:700}.res-L{color:#ff3b30;font-weight:700}
.cd{display:flex;justify-content:center;gap:2px;margin:12px 0 6px}
.cd em{font-style:normal;font-size:26px;font-weight:800;line-height:1.1;color:var(--muted);align-self:flex-start;padding:0 1px}
.cd span{display:flex;flex-direction:column;align-items:center;min-width:42px;font-size:12px;color:var(--muted);font-weight:600}
.cd b{font-size:28px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;color:var(--accent);line-height:1.1}
.tab{font-size:10.5px}
/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 6px;padding:2px 16px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:99px;padding:7px 14px;font:600 14px -apple-system,sans-serif;background:var(--card);color:var(--text);cursor:pointer}
.chip.on{background:var(--accent);color:#fff}
.tab{font-size:10.5px}
/* Standings */
.tr{display:grid;grid-template-columns:22px 1fr 22px 22px 22px 22px 30px 30px;gap:4px;padding:9px 12px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums;position:relative}
.tr>div{text-align:center}
.tr+.tr::before{content:"";position:absolute;top:0;left:12px;right:0;border-top:.5px solid var(--line)}
.tr.hd{color:var(--muted);font-weight:600;font-size:12px;padding-top:11px;padding-bottom:7px}
.tr.me{background:var(--accent-soft);font-weight:700}
.tr .rk{color:var(--muted)}
.tr .nm{display:flex;align-items:center;gap:7px;min-width:0;font-size:14px;font-weight:600;text-align:left}
.tr .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .pt{font-weight:800}
/* League switcher */
.lgsel{position:relative;margin:26px 0 8px 16px;display:inline-block}
#lgBtn{background:none;border:0;padding:4px 0;font:700 15px -apple-system,sans-serif;color:var(--accent);cursor:pointer;display:flex;align-items:center;gap:6px}
#lgBtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
#lgBtn.open svg{transform:rotate(180deg)}
#lgMenu{display:none;position:absolute;top:100%;left:0;min-width:210px;background:var(--card);border-radius:14px;box-shadow:0 12px 36px rgba(0,0,0,.25);border:.5px solid var(--line);z-index:10;overflow:hidden}
#lgMenu.show{display:block}
#lgMenu button{display:flex;width:100%;justify-content:space-between;align-items:center;background:none;border:0;padding:13px 16px;font:500 16px -apple-system,sans-serif;color:var(--text);cursor:pointer;text-align:left}
#lgMenu button+button{border-top:.5px solid var(--line)}
#lgMenu button.on{color:var(--accent);font-weight:700}
#lgMenu button span{visibility:hidden}
#lgMenu button.on span{visibility:visible}
.tr.z1{box-shadow:inset 3px 0 0 #34c759}.tr.z2{box-shadow:inset 3px 0 0 #0a84ff}.tr.z3{box-shadow:inset 3px 0 0 #ff453a}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:12px 16px 0;color:var(--muted);font-size:12.5px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* Events by side */
.ev2{display:grid;grid-template-columns:1fr 46px 1fr;gap:6px;padding:10px 12px;align-items:center;position:relative}
.ev2+.ev2::before{content:"";position:absolute;top:0;left:12px;right:12px;border-top:.5px solid var(--line)}
.ev2 .m{text-align:center;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.ev2 .l{text-align:right}
.evh{display:grid;grid-template-columns:1fr 46px 1fr;gap:6px;padding:10px 12px 4px;font-weight:700;font-size:14px;align-items:center}
.evh>div{display:flex;align-items:center;gap:7px}
.evh>div:first-child{justify-content:flex-end}
/* Tab bar */
.tabbar{display:flex;background:var(--bar);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
  border-top:.5px solid var(--line);padding:6px 0 calc(env(safe-area-inset-bottom,0px) + 2px)}
.tab{flex:1;border:0;background:none;color:var(--muted);font:500 11px -apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;cursor:pointer}
.tab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.active{color:var(--accent)}

p.foot{color:var(--muted);font-size:12.5px;margin:12px 16px 0}
/* In-app push banner */
#toast{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:20;

#toast.show{transform:none}

/* Install hint */
#install{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);z-index:15;display:none;

#install b{font-size:16px}
#install p{margin:6px 0 12px;color:var(--muted);font-size:14.5px}
#install .btn{margin:0;padding:11px}

#install::after{content:"";position:absolute;bottom:-8px;left:50%;margin-left:-9px;width:18px;height:18px;background:var(--card);transform:rotate(45deg);border-right:.5px solid var(--line);border-bottom:.5px solid var(--line)}

const ymd = d => d.toISOString().slice(0,10).replace(/-/g,'');
/* Эмблемы без файлов: приложение само скачивает логотип, уменьшает его и сохраняет в памяти телефона (data-URI) —
   дальше он показывается как встроенный, в том числе без интернета. Если сервер логотипов не разрешает чтение, остаётся обычная загрузка по ссылке. */
let CCACHE={}; try{CCACHE=JSON.parse(store.get('crestcache')||'{}')}catch(e){}
const CTRIED=new Set(); let ccBusy=false;
function logoToDataURI(url){
  return fetch(url,{mode:'cors',cache:'force-cache'}).then(r=>{if(!r.ok) throw 0; return r.blob()}).then(blob=>new Promise((res,rej)=>{
    const u=URL.createObjectURL(blob), im=new Image();
    im.onload=()=>{try{const k=Math.min(1,120/Math.max(im.width,im.height)), c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.width*k)); c.height=Math.max(1,Math.round(im.height*k));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/png'))}catch(e){rej(e)}};
    im.onerror=rej; im.src=u;
  }));
}
async function cacheCrests(list){
  if(ccBusy) return; ccBusy=true; let added=0;
  const todo=[]; list.forEach(x=>{ if(x&&x.name&&x.logo&&/^https?:/.test(x.logo)&&!CREST_DATA[x.name]&&!CCACHE[x.name]&&!CTRIED.has(x.name)&&!todo.some(t=>t.name===x.name)){CTRIED.add(x.name);todo.push(x)} });
  for(let i=0;i<todo.length;i+=3){
    await Promise.all(todo.slice(i,i+3).map(x=>logoToDataURI(x.logo).then(d=>{CCACHE[x.name]=d;added++}).catch(()=>{})));
  }
  if(added){ store.set('crestcache',JSON.stringify(CCACHE)); renderAll(); renderStandings(); }
  ccBusy=false;
}
const PRELOADED=new Set();
function prefetchLogos(urls){
  const q=[...new Set(urls.filter(u=>u&&/^https?:/.test(u)&&!PRELOADED.has(u)))]; q.forEach(u=>PRELOADED.add(u));
  let i=0; (function next(){ for(let k=0;k<6&&i<q.length;k++,i++){const im=new Image(); im.src=q[i]} if(i<q.length) setTimeout(next,250) })();
}

const CL_ORDER=[['Атлетико',1],['ЛАСК',0],['Вильярреал',1],['Фенербахче',0],['Брюгге',0],['Порту',1],['Интер',0],['Ланс',1]];
const ORD={'first':1,'second':2,'third':3,'fourth':4,'fifth':5,'sixth':6};
function stageRU(t){
  t=String(t||''); if(!t) return '';
  let m=t.match(/(?:match\s*day|matchweek|game\s*week|week)\s*(\d+)/i); if(m) return m[1]+' тур';
  if(/round of 16|last 16/i.test(t)) return '1/8 финала';
  if(/quarter/i.test(t)) return '1/4 финала';
  if(/semi/i.test(t)) return '1/2 финала';
  if(/play-?off/i.test(t)) return 'Плей-офф';
  if(/\bfinal\b/i.test(t)) return 'Финал';
  m=t.match(/(\d+)(?:st|nd|rd|th)\s*round/i)||t.match(/round\s*(\d+)/i); if(m) return m[1]+'-й раунд';
  m=t.match(/(first|second|third|fourth|fifth|sixth)\s*round/i); if(m) return ORD[m[1].toLowerCase()]+'-й раунд';
  return '';
}
function stageOf(f){
  if(f.stage) return f.stage;
  const i=(arr)=>arr.findIndex(x=>x[0]===f.opp&&x[1]===(f.home?1:0));
  if(f.comp==='Премьер лига'){const k=i(PL_ORDER); return k>=0?(k+1)+' тур':''}
  if(f.comp==='Лига чемпионов'){const k=i(CL_ORDER); if(k>=0) return (k+1)+' тур';
    const d=f.date, mo=d.getUTCMonth(), dd=d.getUTCDate();                      // плей-офф: ориентировочно по датам
    if(d.getUTCFullYear()===2027){ if(mo===1) return 'Плей-офф'; if(mo===2) return '1/8 финала'; if(mo===3&&dd<=20) return '1/4 финала'; if((mo===3&&dd>20)||(mo===4&&dd<=15)) return '1/2 финала'; if(mo===4&&dd>15) return 'Финал' }
  }
  return '';

const scoreOf=x=>{const v=x&&x.score; if(v&&typeof v==='object') return parseInt(v.value!=null?v.value:v.displayValue,10)||0; return parseInt(v,10)||0};
const shootOf=x=>{const v=x&&x.shootoutScore; if(v==null) return null; return typeof v==='object'?+(v.value!=null?v.value:v.displayValue):+v};
function toFixture(ev,lg){
  const c=ev.competitions&&ev.competitions[0]; if(!c||!c.competitors) return null;
  const me=c.competitors.find(x=>x.team&&String(x.team.id)===TEAM_ID); if(!me) return null;
  const op=c.competitors.find(x=>x!==me); if(!op||!op.team) return null;
  const home=c.competitors.find(x=>x.homeAway==='home')||me, away=c.competitors.find(x=>x.homeAway==='away')||op;
  const st=c.status||ev.status||{}, ty=st.type||{};
  const f={id:String(ev.id), opp:ru(op.team.displayName||op.team.name), oppLogo:op.team.logo||(op.team.logos&&op.team.logos[0]&&op.team.logos[0].href)||'',
    home:me===home, comp:LEAGUES[lg], lg, venue:(c.venue&&c.venue.fullName)||'', date:new Date(ev.date), state:ty.state||'pre',
    clock:st.displayClock||'', ht:ty.name==='STATUS_HALFTIME', events:[]};
  if(isNaN(f.date)) return null;
  try{ const notes=(c.notes||ev.notes||[]).map(n=>n.headline||n.text||'').join(' ')+' '+((ev.season&&ev.season.slug)||'')+' '+(ev.name&&/round|final|leg|play/i.test(ev.name)?ev.name:'');
    const st=stageRU(notes); if(st) f.stage=st; }catch(e){}
  if(f.state!=='pre'){ f.hs=scoreOf(home); f.as=scoreOf(away); }
  const ph=shootOf(home), pa=shootOf(away); if(ph!=null&&pa!=null&&!isNaN(ph)&&!isNaN(pa)) f.pens=[ph,pa];
  f.events=(c.details||[]).map(d=>({
    min:(d.clock&&d.clock.displayValue)||'', goal:!!d.scoringPlay, yellow:!!d.yellowCard, red:!!d.redCard,
    og:!!d.ownGoal, pen:!!d.penaltyKick, mine:!!(d.team&&String(d.team.id)===TEAM_ID),
    player:(d.athletesInvolved&&d.athletesInvolved[0]&&d.athletesInvolved[0].displayName)||''
  })).filter(e=>e.goal||e.yellow||e.red);
  return f;
}
// весь календарь сезона по каждому турниру (АПЛ, Лига чемпионов, Кубок Англии, Кубок лиги) — расписание команды в ESPN
async function loadSeason(){
  const keys=Object.keys(LEAGUES), map=new Map(); let ok=0;
  const getJ=url=>fetch(url,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null);
  const take=(j,lg)=>{ if(!j) return; ok++; (j.events||[]).forEach(ev=>{const f=toFixture(ev,lg); if(f&&!map.has(f.id)) map.set(f.id,f)}) };
  // 1) расписание команды в каждом турнире
  const jobs=keys.map(lg=>getJ(`${ESPN}${lg}/teams/${TEAM_ID}/schedule`).then(j=>take(j,lg)));
  // 2) проход табло по датам от сегодня до конца сезона (1 июня) кусками по 20 дней — ловит матчи, которых нет в расписании
  const now=new Date(), endY=now.getUTCMonth()>=6?now.getUTCFullYear()+1:now.getUTCFullYear(), end=new Date(Date.UTC(endY,5,1));
  for(let t=Date.now(); t<end; t+=20*864e5){
    const a=new Date(t), b=new Date(Math.min(t+19*864e5,+end));
    keys.forEach(lg=>jobs.push(getJ(`${ESPN}${lg}/scoreboard?dates=${ymd(a)}-${ymd(b)}`).then(j=>take(j,lg))));
  }
  // 3) прошедшая часть сезона: с 1 июля до сегодня кусками по 20 дней — все сыгранные матчи для вкладки «Результаты»
  const startY=now.getUTCMonth()>=6?now.getUTCFullYear():now.getUTCFullYear()-1, start=Date.UTC(startY,6,1);
  for(let t=start; t<Date.now(); t+=20*864e5){
    const a=new Date(t), b=new Date(Math.min(t+19*864e5,Date.now()));
    keys.forEach(lg=>jobs.push(getJ(`${ESPN}${lg}/scoreboard?dates=${ymd(a)}-${ymd(b)}`).then(j=>take(j,lg))));
  }
  await Promise.all(jobs);
  return {out:[...map.values()],ok};
}
async function loadMatches(full){
  const keys=Object.keys(LEAGUES); ERRS=[];
  const get=url=>fetch(url,{cache:'no-store'}).then(r=>{if(!r.ok){ERRS.push('HTTP '+r.status);return null}return r.json()}).catch(()=>{ERRS.push('сеть/CORS');return null});
  const jobs=[];                                   // [индекс турнира, url]
  if(full) for(let off=-28; off<56; off+=14){      // расписание: прошлое и будущее, кусками по 14 дней
    const a=new Date(Date.now()+off*864e5), b=new Date(Date.now()+(off+13)*864e5);
    keys.forEach((lg,i)=>jobs.push([i,`${ESPN}${lg}/scoreboard?dates=${ymd(a)}-${ymd(b)}`]));
  }
  keys.forEach((lg,i)=>jobs.push([i,`${ESPN}${lg}/scoreboard`]));   // свежие live-данные
  const res=await Promise.all(jobs.map(j=>get(j[1])));
  if(res.every(r=>!r)) throw new Error(ERRS[0]||'offline');
  const map=new Map();
  res.forEach((j,n)=>{ const i=jobs[n][0];
    if(!j||!j.events) return;
    (j.events||[]).forEach(ev=>{ const f=toFixture(ev,keys[i]); if(f) map.set(f.id,f) });
  });
  const out=[...map.values()];
  out.sort((x,y)=>x.date-y.date);
  return out;
}

// если ESPN вернул меньше матчей, дополняем будущие игры встроенным расписанием
function mergeStatic(fx){
  const near=(x,f)=>Math.abs(x.date-f.date)<1.5*864e5||(x.opp===f.opp&&Math.abs(x.date-f.date)<7*864e5);
  const add=STATIC.filter(f=>(f.state==='post'||f.date>Date.now())&&!fx.some(x=>near(x,f)));
  return fx.concat(add).sort((a,b)=>a.date-b.date);
}
let SEASON_INFO=null, lastSeason=0, lastFull=0, firstLoad=true, ERRS=[], LASTOK=null, LASTERR='';
async function refresh(){
  try{
    const prev=Object.fromEntries(FIXTURES.map(f=>[f.id,(f.events||[]).filter(e=>e.goal).length]));
    const full=SOURCE!=='live'||Date.now()-lastFull>30*60000;
    const got=await loadMatches(full);
    if(full) loadStandings();
    if(full) lastFull=ERRS.length?Date.now()-25*60000:Date.now();   // при ошибках повторим через 5 минут
    const byId=new Map(FIXTURES.filter(f=>f.lg).map(f=>[f.id,f]));
    if(Date.now()-lastSeason>3*3600*1000||!lastSeason){                     // календарь сезона: раз в 3 часа (обновляет кубки и ЛЧ по ходу жеребьёвок)
      const se=await loadSeason(); SEASON_INFO={ok:se.ok,n:se.out.length}; lastSeason=se.ok?Date.now():Date.now()-170*60000;
      se.out.forEach(f=>{const ex=byId.get(f.id); if(!ex||ex.state==='pre') byId.set(f.id,f)});
    }
    got.forEach(f=>byId.set(f.id,f));
    const fx=[...byId.values()].sort((a,b)=>a.date-b.date);
    FIXTURES=mergeStatic(fx); SOURCE='live'; LASTOK=new Date(); LASTERR=''; store.set('fx',JSON.stringify(FIXTURES));

    });

function parseEvents(j){
  const hd=j.header&&j.header.competitions&&j.header.competitions[0];
  const det=(hd&&hd.details)||j.details||[], out=[], seen=new Map();
  const nm=a=>a&&(a.displayName||a.fullName||(a.athlete&&a.athlete.displayName))||'';
  const people=d=>((d.athletesInvolved&&d.athletesInvolved.length?d.athletesInvolved:(d.participants||[]).map(p=>p.athlete||p))||[]).map(nm).filter(Boolean);
  const num=m=>{const x=String(m||'').match(/(\d+)(?:\D+(\d+))?/);return x?(+x[1])+(x[2]?(+x[2])/100:0):999};
  const add=e=>{const k=[e.min,e.sub?'s':e.goal?'g':e.red?'r':'y',e.player||e.pin].join('|'); const ex=seen.get(k);
    if(ex){ if(e.assist&&!ex.assist) ex.assist=e.assist; if(e.pen) ex.pen=true; return } seen.set(k,e); out.push(e)};
  const assistOf=d=>{ if(d.ownGoal||/own/i.test((d.type&&d.type.text)||'')) return ''; const p=people(d); if(p[1]) return p[1];
    const m=String(d.text||d.shortText||'').match(/assisted by\s+([^.,]+?)(?:\s+with|\s+following|\s+from|\.|,|$)/i); return m?m[1].trim():'' };
  const subFrom=(d,tt)=>{ // замена: «X replaces Y» в тексте, иначе по порядку участников
    const m=String(d.text||d.shortText||'').match(/\.\s*([^.]+?)\s+replaces\s+([^.]+?)(?:\.|\s+because|$)/i); let pin,pout;
    if(m){pin=m[1].trim();pout=m[2].trim()} else {const p=people(d); pin=p[0]||'';pout=p[1]||''}
    return {sub:true,pin,pout,player:pin}};
  const base=(d,tt)=>({min:(d.clock&&d.clock.displayValue)||'',goal:false,yellow:false,red:false,og:false,pen:false,
    mine:!!(d.team&&String(d.team.id)===TEAM_ID)});
  det.forEach(d=>{
    const tt=(d.type&&(d.type.text||d.type.type))||'', e=base(d,tt);
    if(d.scoringPlay){add({...e,goal:true,og:!!d.ownGoal,pen:!!d.penaltyKick,player:people(d)[0]||'',assist:assistOf(d)})}
    else if(d.redCard){add({...e,red:true,player:people(d)[0]||''})}
    else if(d.yellowCard){add({...e,yellow:true,player:people(d)[0]||''})}
    else if(/substitution/i.test(tt)){add({...e,...subFrom(d,tt)})}

    const tt=(k.type&&(k.type.text||k.type.type))||'', e=base(k,tt);

    if(goal) add({...e,goal:true,og:/own/i.test(tt),pen:/penalty/i.test(tt),player:people(k)[0]||'',assist:assistOf(k)});
    else if(red) add({...e,red:true,player:people(k)[0]||''});
    else if(yellow) add({...e,yellow:true,player:people(k)[0]||''});

}
function parseSummary(j,f){

    const me=a.find(x=>x.team&&String(x.team.id)===TEAM_ID), op=a.find(x=>x!==me); return f.home?[me,op]:[op,me]};
  const out={stats:[],lineups:null};

  if(bt.length>=2){
    const [l,r]=pick(bt), m=t=>{const v={},lab={};((t&&t.statistics)||[]).forEach(x=>{v[x.name]=x.displayValue!=null?x.displayValue:x.value;lab[x.name]=x.label||x.displayName||x.name});return [v,lab]};
    const [ls,ll]=m(l), [rs,rl]=m(r), push=(label,a,b,unit)=>{const lv=parseFloat(a)||0, rv=parseFloat(b)||0, tot=lv+rv;
      out.stats.push({label,l:(a==null?'—':a)+(unit&&a!=null?unit:''),r:(b==null?'—':b)+(unit&&b!=null?unit:''),pct:tot>0?lv/tot*100:50})};
    STAT_ORDER.forEach(([k,label,unit])=>{ if(ls[k]!=null||rs[k]!=null) push(label,ls[k],rs[k],unit) });
    if(!out.stats.length) Object.keys(ls).concat(Object.keys(rs).filter(k=>!(k in ls))).slice(0,14).forEach(k=>push(ll[k]||rl[k]||k,ls[k],rs[k]));
  }

      const pl=t.roster.map(p=>({n:p.jersey||'',name:(p.athlete&&(p.athlete.displayName||p.athlete.fullName))||'—',
        pos:(p.position&&(p.position.abbreviation||p.position.name))||'',starter:!!p.starter}));

        starters:hasStarters?pl.filter(p=>p.starter):pl.slice(0,11), subs:hasStarters?pl.filter(p=>!p.starter):pl.slice(11)} };

    if(!en.length&&j.standings&&j.standings.entries) en=j.standings.entries;

      return {id:String(x.team.id),name:ru(x.team.displayName||x.team.name),logo:(x.team.logos&&x.team.logos[0]&&x.team.logos[0].href)||'',

let VAL_ASOF='ноябрь 2026 (FootballTransfers)', VAL_AT=0, VAL_MSG='';
let VUSER={}; try{VUSER=JSON.parse(store.get('vals_user')||'{}')}catch(e){}
function setVals(vals){ SQUAD.forEach(p=>{const v=vals&&vals[p.k]; if(v!=null&&v!==''&&!isNaN(+v)) p.v=+v}) }
function applyAll(){   // порядок: встроенные → загруженные → ваши ручные
  SQUAD.forEach(p=>p.v=null); setVals(DEFAULT_VALUES);
  try{setVals(JSON.parse(store.get('vals')||'null'))}catch(e){}
  setVals(VUSER);
}
applyAll();
function parseValues(txt){
  try{const j=JSON.parse(txt); if(j.asOf) VAL_ASOF=j.asOf; return j.values||j}
  catch(e){const vals={}; txt.split(/\r?\n/).forEach(l=>{const m=l.split(/[;,\t]/); if(m.length>=2){const k=m[0].trim().toLowerCase().replace(/^"|"$/g,''), v=parseFloat(m[1].replace(',','.')); if(k&&!isNaN(v)) vals[k]=v}});
    VAL_ASOF='ваша таблица'; return vals}
}
async function loadValues(manual){
  try{
    const r=await fetch(VALUES_URL+(VALUES_URL.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status);
    const vals=parseValues(await r.text()), n=Object.keys(vals).filter(k=>vals[k]!=null&&!isNaN(+vals[k])).length;
    if(!n) throw new Error('в файле нет значений');
    store.set('vals',JSON.stringify(vals)); applyAll(); VAL_AT=Date.now(); VAL_MSG=`Загружено значений: ${n}, ${fmtTime(new Date())}`;
  }catch(e){ if(manual) VAL_MSG='Не удалось обновить: '+((e&&e.message)||'ошибка') }
  renderPStats();
}
setInterval(loadValues,6*3600*1000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&Date.now()-VAL_AT>6*3600*1000) loadValues() });
const POS_RU=a=>{a=String(a||'').toUpperCase(); return /^G/.test(a)?'Вратарь':/D|B$/.test(a)&&!/^DM/.test(a)?'Защитник':/^(F|ST|CF|LW|RW|SS|W)/.test(a)?'Нападающий':a?'Полузащитник':''};
const ruPl=n=>{n=Math.abs(n)%100;const d=n%10;return n>10&&n<20?'матчей':d===1?'матч':d>=2&&d<=4?'матча':'матчей'};
const PS_COMPS={'eng.1':'Премьер лига','uefa.champions':'Лига чемпионов'};
let PS_COMP=store.get('pscomp'); if(!PS_COMPS[PS_COMP]&&PS_COMP!=='value') PS_COMP='eng.1';
let PS_TAB=store.get('pstab')||'goals'; if(!['goals','assists','cs','yellow','red','rating'].includes(PS_TAB)) PS_TAB='goals';

/* автоматический сбор: составы сыгранных матчей ESPN → голы, передачи, матчи */
let PSC={}; try{PSC=JSON.parse(store.get('psc')||'{}')}catch(e){}   // id матча -> строки игроков (для завершённых матчей)
const PSLIVE={};                                                      // id -> {at, rows} для идущих матчей
let psBusy=false, psAt=0;
async function fetchSummary(id,lg){
  for(const l of [lg,...Object.keys(LEAGUES)].filter((v,i,a)=>v&&a.indexOf(v)===i)){
    try{const r=await fetch(`${ESPN}${l}/summary?event=${encodeURIComponent(id)}`,{cache:'no-store'});
      if(r.ok){const j=await r.json(); if(j&&(j.rosters||j.boxscore)) return j}}catch(e){}
  } return null;
}
function rosterRows(j){
  const t=(j.rosters||[]).find(x=>x.team&&String(x.team.id)===TEAM_ID); if(!t||!t.roster) return null;
  let has=false; const out=[];
  t.roster.forEach(p=>{
    const stats=p.stats||[], st={}; stats.forEach(s=>{st[s.name]=+(s.value!=null?s.value:s.displayValue)||0});
    if(stats.some(s=>/goal/i.test(s.name))) has=true;
    const name=p.athlete&&(p.athlete.displayName||p.athlete.fullName); if(!name) return;
    const played=!!(p.starter||p.subbedIn||st.appearances>0||st.subIns>0);
    const rk=stats.find(x=>/rating/i.test(x.name)), rt=rk&&+(rk.value!=null?rk.value:rk.displayValue)>0?+(rk.value!=null?rk.value:rk.displayValue):null;
    out.push({name,pos:(p.position&&(p.position.abbreviation||p.position.name))||'',g:st.totalGoals||st.goals||0,a:st.goalAssists||st.assists||0,
      y:st.yellowCards||0,r:st.redCards||0,rt,m:played?1:0});
  });
  return has?out:null;
}
const psPlayed=comp=>FIXTURES.filter(f=>f.comp===comp&&(f.state==='post'||f.state==='in'));
async function loadPlayerStats(){
  if(psBusy) return; psBusy=true;
  try{
    const todo=[];
    FIXTURES.forEach(f=>{
      if(!/^\d+$/.test(f.id)||!Object.values(PS_COMPS).includes(f.comp)) return;
      if(f.state==='post'&&(!PSC[f.id]||Array.isArray(PSC[f.id]))) todo.push(f);
      else if(f.state==='in'&&(!PSLIVE[f.id]||Date.now()-PSLIVE[f.id].at>45000)) todo.push(f);
    });
    for(let i=0;i<todo.length;i+=3){
      await Promise.all(todo.slice(i,i+3).map(async f=>{
        const j=await fetchSummary(f.id,f.lg); const rows=j&&rosterRows(j); if(!rows) return;
        if(f.state==='post'){PSC[f.id]={v:2,rows}} else PSLIVE[f.id]={at:Date.now(),rows};
      }));
    }
    if(todo.length){ // убираем из кэша чужие/устаревшие записи и сохраняем
      const ids=new Set(FIXTURES.map(f=>f.id)); Object.keys(PSC).forEach(k=>{if(!ids.has(k)) delete PSC[k]});
      store.set('psc',JSON.stringify(PSC)); psAt=Date.now();
    }
  }catch(e){}
  psBusy=false; renderPStats();
}
function aggRows(comp){
  const fx=psPlayed(comp), map=new Map(); let loaded=0;
  fx.forEach(f=>{
    const e0=f.state==='post'?PSC[f.id]:PSLIVE[f.id], rows=e0&&(Array.isArray(e0)?(f.state==='in'?e0:null):(e0.rows||null)); if(!rows) return; loaded++;
    const ga=f.home?f.as:f.hs;                                   // сколько пропустил Ливерпуль в матче
    rows.forEach(r=>{const nk=norm(r.name), st=SQUAD.find(p=>nk.includes(p.k)); const key=st?st.k:nk;
      const e=map.get(key)||{n:st?st.n:r.name,pos:st?st.pos:POS_RU(r.pos),m:0,g:0,a:0,y:0,r:0,cs:0,rs:0,rn:0,v:st?st.v:null};
      e.m+=r.m;e.g+=r.g;e.a+=r.a;e.y+=r.y||0;e.r+=r.r||0;
      if(ga===0&&r.m&&/Вратарь|Защитник/.test(e.pos)) e.cs++;     // сухой матч — для вратарей и защитников
      if(r.rt!=null){e.rs+=r.rt;e.rn++}
      map.set(key,e)})});
  const rows=[...map.values()].filter(p=>p.m>0||p.g>0||p.a>0).map(p=>({...p,rt:p.rn?p.rs/p.rn:null}));
  return {rows,loaded,total:fx.length};
}
const PS_TABS=[['goals','Голы','g'],['assists','Голевые передачи','a'],['cs','Сухие матчи','cs'],['yellow','Жёлтые карточки','y'],['red','Красные карточки','r'],['rating','Средняя оценка','rt']];
function renderPStats(){
  if(!$('#psBody')) return;
  const top=$('#psComp'), sub=$('#psSeg');
  if(top.children.length!==3) top.innerHTML=[['eng.1','Премьер лига'],['uefa.champions','Лига чемпионов'],['value','Трансферная стоимость']].map(([k,t])=>`<button class="chip" data-pc="${k}">${t}</button>`).join('');
  if(sub.children.length!==PS_TABS.length) sub.innerHTML=PS_TABS.map(([k,t])=>`<button class="chip" data-ps="${k}">${t}</button>`).join('');
  top.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b.dataset.pc===PS_COMP));
  sub.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b.dataset.ps===PS_TAB));
  sub.style.display=PS_COMP==='value'?'none':'';
  const vt=$('#valTools'); vt.style.display=PS_COMP==='value'?'':'none';
  if(PS_COMP==='value'){ if(document.activeElement!==$('#vUrl')) $('#vUrl').value=VALUES_URL==='values.json'?'':VALUES_URL; $('#vMsg').textContent=VAL_MSG; }
  const body=$('#psBody'), foot=$('#psFoot'); let list,key,note;
  if(PS_COMP==='value'){ key='v'; list=SQUAD; note=`Оценка стоимости (млн €): ${VAL_ASOF}. Значения подгружаются из ${VALUES_URL==='values.json'?'файла values.json рядом с приложением':'вашего источника'} раз в 6 часов. Ваши ручные значения (нажмите на игрока) важнее загруженных. Без значения стоит «н/д». Transfermarkt автоматически подтянуть нельзя: у него нет открытого API.`; }
  else{
    const tab=PS_TABS.find(t=>t[0]===PS_TAB)||PS_TABS[0]; key=tab[2];
    const compName=PS_COMPS[PS_COMP], agg=aggRows(compName), complete=agg.total&&agg.loaded===agg.total&&agg.rows.length;
    const staticOK=PS_COMP==='eng.1'&&(key==='g'||key==='a');
    const cov=`учтено матчей ${agg.loaded} из ${agg.total}${psAt?', обновлено '+fmtTime(new Date(psAt)):''}`;
    if(complete||(agg.rows.length&&!staticOK)){ list=agg.rows; note=`${compName}: ${cov}. Считается автоматически по составам матчей ESPN, идущий матч — в реальном времени.`+(complete?'':' Остальные матчи подгружаются.'); }
    else if(staticOK){ list=PLAYERS; note=`Премьер лига 2026/27, данные внесены вручную на ${PSTATS_AS_OF}. ${agg.total?`Автоматически загружено ${agg.loaded} из ${agg.total} матчей.`:'Нет связи с ESPN.'}`; }
    else { body.innerHTML=`<div class="note">${agg.total?'Загружаем статистику матчей…':'Статистика появится после загрузки данных ESPN.'}</div>`; foot.textContent=''; return }
    if(key==='rt'&&!list.some(p=>p.rt!=null)){
      body.innerHTML='<div class="note">ESPN не отдаёт оценки игроков за матчи, поэтому средняя оценка пока недоступна. Пункт заполнится сам, если в данных матчей появятся оценки.</div>'; foot.textContent=note; return }
    if(key==='y'||key==='r') note+=' Чем больше карточек, тем выше в списке.';
    if(key==='cs') note+=' Сухой матч засчитывается вратарям и защитникам, сыгравшим в матче, в котором Ливерпуль не пропустил.';
  }
  if(key!=='v') list=list.filter(p=>key==='rt'?p.rt!=null:(p[key]||0)>0);   // игроков с нулём не показываем
  if(!list.length){ body.innerHTML='<div class="note">Пока нет игроков с этим показателем.</div>'; foot.textContent=note; return }
  list=[...list].sort((x,y)=>{
    const xv=x[key]==null?-1:x[key], yv=y[key]==null?-1:y[key];
    if(yv!==xv) return yv-xv;
    if(key==='g'||key==='a'){const o=key==='g'?'a':'g'; if((y[o]||0)!==(x[o]||0)) return (y[o]||0)-(x[o]||0)}
    if(key==='rt') return y.m-x.m||x.n.localeCompare(y.n,'ru');
    return x.m-y.m||x.n.localeCompare(y.n,'ru');
  });
  const max=Math.max(1,...list.map(p=>p[key]||0)); let rank=0, prev=null;
  const fmt=v=>key==='v'?'€'+v.toString().replace('.',',')+' млн':key==='rt'?v.toFixed(2).replace('.',','):String(v);
  body.innerHTML=list.map((p,i)=>{
    const v=p[key]; if(v!==prev){rank=i+1;prev=v}
    const val=v==null?'<div class="val na">н/д</div>':`<div class="val">${fmt(v)}</div>`;
    const bar=v?`<div class="psbar"><i style="width:${Math.max(3,v/max*100)}%"></i></div>`:'';
    return `<div class="ps ${rank<=3&&v?'top':''}"${key==='v'&&p.k?` data-pk="${p.k}"`:''}><div class="rk">${v==null?'–':rank}</div><div class="nm"><b>${esc(p.n)}</b><small>${esc(p.pos)}${key==='v'?'':' · '+p.m+' '+ruPl(p.m)}</small></div>${val}${bar}</div>`}).join('');
  foot.textContent=note;
}
document.addEventListener('click',e=>{
  const pc=e.target.closest('[data-pc]'); if(pc){PS_COMP=pc.dataset.pc;store.set('pscomp',PS_COMP);renderPStats();return}
  const ps=e.target.closest('[data-ps]'); if(ps){PS_TAB=ps.dataset.ps;store.set('pstab',PS_TAB);renderPStats()}
});


/* ---------- Навигация ---------- */
function switchTab(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.t===id));
  if(id==='standings'&&Date.now()-(STANDS[CUR_LG].at||0)>120000) loadStandings();
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchTab(t.dataset.t));

setInterval(()=>{
  renderHero();   // сам переключится на предстоящий матч за 24 часа и обратно после начала
  document.querySelectorAll('.cd[data-ts]').forEach(el=>{el.innerHTML=cdHTML(+el.dataset.ts)});
},1000);
renderAll();   // сразу показываем сохранённые данные
renderStandings(); loadStandings(); renderPStats();
setTimeout(()=>{ if(CUR_LG!=='uefa.champions') loadStandings('uefa.champions') },1500);   // заранее подгружаем таблицу и логотипы Лиги чемпионов
Object.values(STANDS).forEach(S=>S.rows&&prefetchLogos(S.rows.filter(r=>!CREST_DATA[r.name]).map(r=>r.logo)));
refresh();     // затем подтягиваем свежие

/* ---------- Подсказка установки (iOS Safari) ---------- */
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone=window.navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
if(isIOS&&!standalone&&!store.get('installHintDismissed')){
  setTimeout(()=>$('#install').classList.add('show'),1500);
}
$('#installOk').onclick=()=>{$('#install').classList.remove('show');store.set('installHintDismissed','1')};

/* ---------- Service Worker ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(console.warn));
}

</script>
